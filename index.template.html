<!doctype html>
<html lang="en" boltz-theme="default" style="height: 100%">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <link rel="shortcut icon" type="image/ico" href="/favicon.ico" />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/apple-touch-icon.png" />
        <link
            rel="icon"
            type="image/png"
            href="/favicon-32x32.png"
            sizes="32x32" />
        <link
            rel="icon"
            type="image/png"
            href="/favicon-16x16.png"
            sizes="16x16" />
        <link rel="manifest" href="/manifest.json" />
        <link rel="canonical" href="${siteUrl}" />
        <meta name="theme-color" content="${themeColor}" />
        <meta name="color-scheme" content="dark" />

        <!-- Open Graph -->
        <meta property="og:title" content="${siteTitle}" />
        <meta property="og:description" content="${siteDescription}" />
        <meta property="og:url" content="${siteUrl}" />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="${siteTitle}" />
        <meta property="og:image" content="${previewImage}" />
        <meta property="og:image:type" content="image/jpeg" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="${siteTitle}" />

        <!-- Twitter -->
        <meta name="twitter:title" content="${siteTitle}" />
        <meta name="twitter:description" content="${siteDescription}" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:image" content="${previewImage}" />

        <meta name="description" content="${siteDescription}" />
        <meta name="mobile-web-app-capable" content="yes" />

        <title>${siteTitle}</title>
        <style>
            :root {
                --backgroundColor: ${backgroundColor};
                --accentColor: ${accentColor};
            }
            html,
            body {
                background: var(--backgroundColor);
            }
            @keyframes lf-pulse {
                0%,
                100% {
                    transform: translate(-50%, -50%) scale(1);
                    box-shadow: 0 0 24px 0 var(--accentColor);
                }
                50% {
                    transform: translate(-50%, -50%) scale(1.06);
                    box-shadow: 0 0 48px 4px var(--accentColor);
                }
            }
            body > .boot-logo {
                display: none;
            }
            .loading > .boot-logo {
                position: absolute;
                top: 50%;
                left: 50%;
                width: 96px;
                height: 96px;
                border-radius: 50%;
                transform: translate(-50%, -50%);
                display: block;
                animation: lf-pulse 2.4s ease-in-out infinite;
            }
            @media (prefers-reduced-motion: reduce) {
                .loading > .boot-logo {
                    animation: none;
                }
            }
        </style>
    </head>
    <body class="loading">
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <img
            class="boot-logo"
            src="/android-chrome-192x192.png"
            width="96"
            height="96"
            alt="" />
        <div id="root"></div>
        <script>
            if (!window.isSecureContext) {
                console.error(
                    "Error: This site requires a secure context (HTTPS) to function.",
                );

                document.body.classList.remove("loading");
                document.body.innerHTML = "";
                document.body.style.cssText = `
                    margin: 0;
                    padding: 0;
                    min-height: 100vh;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    background: var(--backgroundColor);
                    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
                `;

                const errorContainer = document.createElement("div");
                errorContainer.style.cssText = `
                    max-width: 600px;
                    padding: 48px 32px;
                    text-align: center;
                    color: white;
                `;

                errorContainer.innerHTML = `
                    <div style="font-size: 64px; margin-bottom: 24px;">🔒</div>
                    <h1 style="font-size: 32px; font-weight: 600; margin: 0 0 16px 0; color: #dc2626;">
                        Secure Connection Required
                    </h1>
                    <p style="font-size: 18px; line-height: 1.6; margin: 0 0 24px 0; color: #e5e7eb;">
                        This site requires a secure context (HTTPS) to function.
                    </p>
                    <p style="font-size: 14px; line-height: 1.6; margin: 0; color: #9ca3af;">
                        Please access this site via HTTPS or localhost.
                    </p>
                `;

                document.body.appendChild(errorContainer);

                throw new Error(
                    "Insecure context - blocking app initialization",
                );
            }
        </script>
        <script src="/src/index.tsx" type="module"></script>
        <script type="application/ld+json">
            ${ldJson}
        </script>
    </body>
</html>
